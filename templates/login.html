{% extends "base.html" %}
{% block title %}Acesso | Manager School{% endblock %}
{% block content %}
<section class="panel auth-panel" aria-labelledby="page-title">
    <p class="section-label">ACESSO RESTRITO</p>
    <h1 id="page-title">Entrar no Manager School</h1>
    <p class="panel__description">Use o usuário e a senha definidos para esta demonstração.</p>
    <form method="post" action="{{ url_for('login') }}" class="grade-form" data-loading-form>
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="proximo" value="{{ proximo }}">
        <label class="field">Usuário<input name="usuario" autocomplete="username" required autofocus></label>
        <label class="field">Senha<input name="senha" type="password" autocomplete="current-password" required></label>
        <button class="button button--primary" type="submit" data-loading-label="Entrando…">Entrar</button>
    </form>
</section>
{% endblock %}
