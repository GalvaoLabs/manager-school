services:
  - type: web
    name: manager-school
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    disk:
      name: manager-school-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APP_USERNAME
        value: apresentacao
      - key: APP_PASSWORD
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/manager_school.db
      - key: COOKIE_SECURE
        value: "1"
