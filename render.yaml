services:
  - type: web
    name: manager-school
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /tmp/manager_school.db
      - key: COOKIE_SECURE
        value: "1"
      - key: DEMO_MODE
        value: "1"
      - key: TRUST_X_FORWARDED_FOR
        value: "1"
      - key: RATELIMIT_STORAGE_URI
        value: memory://

